<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VetSystem — Gestión Veterinaria</title>
    <meta name="description" content="Sistema integral de gestión veterinaria: pacientes, citas, historias clínicas y notificaciones." />
    <meta name="theme-color" content="#0B7285" />
    <!-- La app es privada; no tiene sentido que los bots la indexen -->
    <meta name="robots" content="noindex, nofollow" />
    <base href="/" />

    <!-- Sin preload la fuente se descubre hasta que app.css se analiza y el texto cambia de fuente tarde -->
    <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <!-- La splash vive dentro de #app: el primer render de Blazor la reemplaza sin necesidad de script propio,
         que además la CSP no permitiría -->
    <div id="app">
        <div class="splash" role="status">
            <div class="splash-brand">
                <span class="splash-icon" aria-hidden="true">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="5.5" cy="10" r="2.2" /><circle cx="9.5" cy="5.8" r="2.2" />
                        <circle cx="14.5" cy="5.8" r="2.2" /><circle cx="18.5" cy="10" r="2.2" />
                        <path d="M12 11c-3 0-6 4.4-6 7 0 1.7 1.4 2.6 3 2.2 1-.3 2-.7 3-.7s2 .4 3 .7c1.6.4 3-.5 3-2.2 0-2.6-3-7-6-7z" />
                    </svg>
                </span>
                <span class="splash-name">VetSystem</span>
            </div>
            <span class="splash-tagline">Cargando…</span>
            <span class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">✕</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
