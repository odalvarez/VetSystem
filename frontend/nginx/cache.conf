# Contexto http (lo carga conf.d/*.conf). Solo los archivos de _framework con huella en el nombre pueden ser
# immutable; el resto (index.html, blazor.boot.json, blazor.webassembly.js, css, fuentes) cambia sin cambiar
# de nombre y se revalida con ETag. Las APIs deciden su propia caché: el valor vacío omite la cabecera
map $uri $cache_control {
    "~^/api/"                                          "";
    "~^/_framework/.+\.[a-z0-9]{10}\.(wasm|js|dat)$"  "public, max-age=31536000, immutable";
    default                                            "no-cache";
}
