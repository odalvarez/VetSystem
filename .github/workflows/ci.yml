name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore & build — auth-service
        run: dotnet build services/auth-service/AuthService.sln --configuration Release

      - name: Test — auth-service
        run: dotnet test services/auth-service/AuthService.sln --configuration Release --no-build --verbosity normal

      - name: Restore & build — patients-service
        run: dotnet build services/patients-service/PatientsService.sln --configuration Release

      - name: Test — patients-service
        run: dotnet test services/patients-service/PatientsService.sln --configuration Release --no-build --verbosity normal

      - name: Restore & build — appointments-service
        run: dotnet build services/appointments-service/AppointmentsService.sln --configuration Release

      - name: Test — appointments-service
        run: dotnet test services/appointments-service/AppointmentsService.sln --configuration Release --no-build --verbosity normal

      - name: Restore & build — notifications-service
        run: dotnet build services/notifications-service/NotificationsService.sln --configuration Release

      - name: Test — notifications-service
        run: dotnet test services/notifications-service/NotificationsService.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend components
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Incluye la paridad de la política de contraseña con el backend (tests/password-cases.json)
      - name: Test — frontend
        run: dotnet test tests/VetSystem.Frontend.Tests/VetSystem.Frontend.Tests.csproj --configuration Release --verbosity normal

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [test, frontend]
    # El WebKit de Playwright en Linux tumba el runtime de .NET WebAssembly de forma intermitente al arrancar
    # (bug del motor, no de la app); se ejecuta como señal informativa y no bloquea
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      # Todo sale de tests/VetSystem.E2E/e2e.env (valores de prueba): no hacen falta secretos
      - name: Start isolated stack
        run: >
          docker compose -p vetsystem-e2e --env-file tests/VetSystem.E2E/e2e.env
          -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait

      - name: Run suite in ${{ matrix.browser }}
        run: sh tests/VetSystem.E2E/run-in-container.sh ${{ matrix.browser }}

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p vetsystem-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -p vetsystem-e2e -f docker-compose.yml -f docker-compose.e2e.yml down -v
